<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">  
        <title>Academia de Heróis</title>
        <link rel="stylesheet" href="./css/style.css"/>
    </head>
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <p>Inscreva-se para participar da próxima missão.</p>
        </header>
        <main>
            <section id="card">
                <h1>Faça a sua inscrição</h1>
                 <form action="#" method="post">
                <label for="nome">Nome do herói:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" required>

                <label for="escolha-equipe">Escolha sua equipe</label>
                  <select id="escolha-equipe" name="escolha-equipe">
                    <option>Escolha uma equipe</option>
                    <option>Liga da Justiça</option>
                    <option>Jovens Titãs</option>
                    <option>Vingadores</option>
                  </select>
                
        <section id="qual-poder">
            <h3>Qual poder você prefere?</h3>
            <label for="Voar">Voar</label>
            <input id="Voar" name="poder" type="radio">
            <label for="Supervelocidade">Supervelocidade</label>
            <input id="Supervelocidade" name="poder" type="radio">
            <label for="Superforca">Superforça</label>
            <input id="Superforca" name="poder" type="radio">
            <label for="NovasMissoes">Quero receber novas missões</label>
            <input id="NovasMissoes" name="poder" type="radio">

        </section>

        <label for="obs">Por que você quer ser um herói?</label>
        <section id="botao">
          <textarea id="obs" name="obs" rowa="5"></textarea>
          <button type="submit">Enviar inscrição</button>
        </section>
    </section>
    </main>
    <footer>
        <p>Página desenvolvida para a prática de formulários HTML.</p>
    </footer>
    </body>
</html>
